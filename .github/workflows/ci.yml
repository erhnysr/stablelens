name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly live check against Arc mainnet and testnet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pytest

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pytest tests/test_live.py -v
        env:
          STABLELENS_LIVE: "1"

  hermes-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: stablelens
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Hermes installed the way its own CI installs it: uv against the committed lock.
      - run: git clone --depth 1 https://github.com/NousResearch/hermes-agent hermes-agent
      - run: python -m pip install uv && uv sync --locked --python 3.14
        working-directory: hermes-agent
      - run: hermes-agent/.venv/bin/hermes plugins validate --install-deps stablelens
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
      - run: hermes-agent/.venv/bin/hermes plugins doctor stablelens --ci
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
      # The catalog's payload gate: nothing compiled or archived may ship.
      - run: python hermes-agent/scripts/scan_plugin_payloads.py stablelens
